name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/modelspy-windows-amd64.exe .
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/modelspy-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/modelspy-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/modelspy-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/modelspy-darwin-arm64 .
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
